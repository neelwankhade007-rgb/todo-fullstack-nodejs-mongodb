<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My To Do List</h1>
        </header>
        <section class="input-area">
            <input type="text" id="taskInput" placeholder="Enter task" maxlength="200" aria-label="New task title">
            <input type="text" id="taskDescription" placeholder="Note (optional)" maxlength="500" aria-label="Task description">
            <button type="button" id="addTaskBtn" onclick="addTask()">Add</button>
        </section>
        <ul id="taskList" aria-label="Task list"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
